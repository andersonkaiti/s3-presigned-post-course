service: presigned-post-course

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  httpApi:
    cors: true
  environment:
    BUCKET_NAME: !Ref PresignedPostBucket
  iam:
    role:
      statements:
        - Action:
            - s3:putObject
          Effect: Allow
          Resource: !Sub "${PresignedPostBucket.Arn}/*"

package:
  individually: true

build:
  esbuild:
    minify: true
    sourcemap: false
    bundle: true

functions:
  getPresignedPOST:
    handler: src/functions/get-presigned-post.handler
    events:
      - httpApi:
          path: /
          method: POST
  getPresignedBatchPOST:
    handler: src/functions/get-presigned-batch-post.handler
    events:
      - httpApi:
          path: /batch
          method: POST

resources:
  Resources:
    PresignedPostBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: full-presigned-post-flow
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - "*"
              AllowedHeaders:
                - "*"
              AllowedMethods:
                - "POST"
