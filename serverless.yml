service: presigned-post-course

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  environment:
    BUCKET_NAME: !Ref PresignedPostBucket
  iam:
    role:
      statements:
        - Action:
            - s3:putObject
          Effect: Allow
          Resource: !Sub "${PresignedPostBucket.Arn}/*"

package:
  individually: true

build:
  esbuild:
    minify: true
    sourcemap: false
    bundle: true

functions:
  getPresignedPUT:
    handler: src/functions/get-presigned-put.handler
    events:
      - httpApi:
          path: /
          method: POST

resources:
  Resources:
    PresignedPostBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: full-presigned-post-flow
